<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Profiza — Logotipo Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1920px;
      height: 1440px;
      background: #F8F9F6;
      font-family: 'Manrope', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }
    .font-display {
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 40px;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 1600px;
      border-radius: 32px;
      padding: 60px 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }
    .card-light {
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
    }
    .card-dark {
      background: #1D4037;
      border: 2px solid #142e28;
    }
    .logo-group {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .icon-box {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 64px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }
    .icon-floresta {
      background-color: #1D4037;
      color: #FFFFFF;
    }
    .icon-lima {
      background-color: #65A30D;
      color: #FFFFFF;
    }
    .logo-text {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .text-floresta { color: #1D4037; }
    .text-lima { color: #65A30D; }
    .text-[#65A30D] { color: #65A30D; }
    .text-white { color: #FFFFFF; }
    .tagline {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .tagline-dark { color: #58645E; }
    .tagline-light { color: #D8F34F; }
    .badge {
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .badge-light {
      background: #D8F34F;
      color: #17211E;
    }
    .badge-dark {
      background: rgba(255,255,255,0.15);
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Versão Fundo Claro -->
    <div class="card card-light">
      <div class="logo-group">
        <div class="icon-box icon-floresta">P</div>
        <div>
          <div class="logo-text">
            <span class="text-floresta">Prof</span><span class="text-lima">iza</span>
          </div>
          <div class="tagline tagline-dark">Diretório Inteligente & Roteamento de Leads</div>
        </div>
      </div>
      <div class="badge badge-light">Versão Principal</div>
    </div>

    <!-- Versão Fundo Escuro (Verde Floresta) -->
    <div class="card card-dark">
      <div class="logo-group">
        <div class="icon-box icon-lima">P</div>
        <div>
          <div class="logo-text">
            <span class="text-white">Prof</span><span class="text-lima">iza</span>
          </div>
          <div class="tagline tagline-light">Diretório Inteligente & Roteamento de Leads</div>
        </div>
      </div>
      <div class="badge badge-dark">Versão Fundo Escuro</div>
    </div>
  </div>
</body>
</html>
